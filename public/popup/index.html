<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUSTools Extension</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        line-height: normal;
        user-select: none !important;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("./Vazirmatn-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("./Vazirmatn-Bold.woff2") format("woff2");
        font-weight: 700;
      }

      html {
        font-size: 62.5%;
        width: 500px;
        height: 400px;
        overflow: hidden;
        border: 1px solid black;
        direction: rtl;
        background-color: #252525;
        color: white;
      }

      :link,
      :visited,
      :link:hover,
      :link:active {
        color: #387ee7;
        text-decoration: none;
      }

      body {
        font-size: 1.6rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-width: 100%;
        min-height: 100%;
        font-family: "Vazirmatn" !important;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
      }

      .h1 {
        display: flex;
        align-items: center;
        gap: 1.2rem;
      }

      ul {
        display: flex;
        flex-direction: row;
        list-style: none;
        gap: 1.4rem;
      }

      ul > li + li {
        border-right: 0.2rem solid currentColor;
        padding-right: 1.4rem;
      }

      button,
      #button {
        border: 1px solid currentColor;
        border-radius: 0.4rem;
        background: inherit;
        font: inherit;
        color: inherit;
        padding: 0.4rem 1.4rem;
        cursor: pointer;
      }

      .buttons {
        display: flex;
        gap: 0.8rem;
        margin: 1rem 0;
      }
    </style>
  </head>
