<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUSTools Extension</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        line-height: normal;
        user-select: none !important;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("./Vazirmatn-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("./Vazirmatn-Bold.woff2") format("woff2");
        font-weight: 700;
      }

      html {
        font-size: 62.5%;
        width: 500px;
        height: 400px;
        overflow: hidden;
        border: 1px solid black;
        direction: rtl;
        background-color: #252525;
        color: white;
      }

      :link,
      :visited,
      :link:hover,
      :link:active {
        color: #387ee7;
        text-decoration: none;
      }

      body {
        font-size: 1.6rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-width: 100%;
        min-height: 100%;
        font-family: "Vazirmatn" !important;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem;
      }

      ul {
        display: flex;
        flex-direction: row;
        list-style: none;
        gap: 1.4rem;
      }

      ul > li + li {
        border-right: 0.2rem solid currentColor;
        padding-right: 1.4rem;
      }

      button,
      a.button,
      a.button:hover,
      a.button:visited,
      a.button:active {
        border: 1px solid currentColor;
        border-radius: 0.4rem;
        background: inherit;
        font: inherit;
        color: inherit;
        padding: 0.4rem 1.4rem;
        cursor: pointer;
      }

      :disabled,
      button:disabled,
      a.button:disabled {
        border-color: #444;
        color: #bbb;
      }

      .buttons {
        display: flex;
        gap: 0.8rem;
        margin: 1rem 0;
      }

      .footer {
        font-size: 1.3rem;
        color: #aaa;
        margin-bottom: -1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>افزونه ابزارهای بوستان</h1>
      <h2>دانشگاه فنی و حرفه‌ای</h2>
      <div class="buttons">
        <a
          class="button"
          href="https://bustan.tvu.ac.ir/"
          target="_blank"
          rel="noopener noreferrer"
          >سامانه بوستان</a
        >
        <a
          class="button"
          href="https://github.com/alialmasi/nustools-ext/issues"
          target="_blank"
          rel="noopener noreferrer"
          >ثبت مشکل افزونه</a
        >
        <!-- <button id="update">بروزرسانی افزونه</button> -->
      </div>
      <ul>
        <!-- <li>
          <a
            href="https://github.com/alialmasi/nustools-ext/issues"
            target="_blank"
            rel="noopener noreferrer"
            >ثبت باگ افزونه</a
          >
        </li> -->
        <li>
          <a
            href="https://alialmasi.ir/fa"
            target="_blank"
            rel="noopener noreferrer"
            >توسعه‌دهنده</a
          >
        </li>
        <li>
          <a
            href="https://nustools.ir"
            target="_blank"
            rel="noopener noreferrer"
            >NUSTools</a
          >
        </li>
      </ul>
      <p class="footer">نسخه <span id="version"></span></p>
      <p class="footer">
        ساخته شده با ❤️ و ☕ در
        <a href="#" target="_blank" rel="noopener noreferrer">شمسی‌پور تهران</a>
      </p>
    </main>
    <script>
      function newtab(href) {
        const a = document.createElement("a");
        a.href = href;
        a.setAttribute("target", "_blank");
        a.click();
        a.remove();
      }

      const currentVersion = "v0.0.7"; // parse from manifest file

      document.addEventListener(
        "DOMContentLoaded",
        () =>
          (document.getElementById("version").textContent =
            currentVersion.slice(1))
      );

      const updateButton = document.getElementById("update");
      const showLatestVersionMessage = () => {
        const oldTextContent = updateButton.textContent;
        updateButton.textContent = "نیازی نیست :)";
        updateButton.setAttribute("disabled", "true");
        console.log("clicked");

        setTimeout(() => {
          updateButton.textContent = oldTextContent;
          updateButton.removeAttribute("disabled");
        }, 2 * 1000);
      };

      document.addEventListener("contextmenu", (e) => e.preventDefault());
      updateButton.addEventListener("click", () => {
        const latestVersion = "v0.0.7"; // fetch from github latest tag
        if (currentVersion === latestVersion) showLatestVersionMessage();
        else
          newtab("https://github.com/alialmasi/nustools-ext/releases/latest");
      });
    </script>
  </body>
</html>
